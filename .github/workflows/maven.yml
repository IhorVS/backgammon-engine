name: Maven build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Configure GitHub Packages credentials
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from xml.sax.saxutils import escape

          settings = Path.home() / ".m2" / "settings.xml"
          settings.parent.mkdir(parents=True, exist_ok=True)
          username = escape(os.environ["GITHUB_ACTOR"])
          token = escape(os.environ["GITHUB_TOKEN"])
          settings.write_text(f"""<settings>
            <servers>
              <server><id>github-game-engine</id><username>{username}</username><password>{token}</password></server>
              <server><id>github-backgammon-board</id><username>{username}</username><password>{token}</password></server>
            </servers>
          </settings>
          """, encoding="utf-8")
          PY

      - name: Build and test
        run: ./mvnw --batch-mode --no-transfer-progress verify
