name: Maven build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out game engine dependency
        uses: actions/checkout@v4
        with:
          repository: IhorVS/game-engine
          path: dependencies/game-engine

      - name: Check out backgammon board dependency
        uses: actions/checkout@v4
        with:
          repository: IhorVS/backgammon-board
          path: dependencies/backgammon-board

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install game engine dependency
        working-directory: dependencies/game-engine
        run: bash ./mvnw --batch-mode --no-transfer-progress install

      - name: Install backgammon board dependency
        working-directory: dependencies/backgammon-board
        run: bash ./mvnw --batch-mode --no-transfer-progress install

      - name: Verify backgammon engine
        run: bash ./mvnw --batch-mode --no-transfer-progress verify
